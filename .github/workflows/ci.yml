name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Guards against a hung step holding a runner for the 6-hour default.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      # --check, not --write: `npm run format` rewrites files in the throwaway
      # CI workspace, so a formatting violation could never actually fail CI.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Dependency Cruiser
        run: npm run depcruise

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      # No --passWithNoTests: the suite has 100+ tests, and the flag would let
      # a jest config regression that matches zero tests pass silently.
      - name: Run Tests
        run: npm test

      - name: Build
        run: npm run build

      # --audit-level=critical, and no continue-on-error: this repo currently
      # carries known moderate/high production vulnerabilities that only clear
      # with a NestJS v10->v11 major bump (tracked separately, not a quick fix)
      # — gating on those today would fail every PR for an unrelated reason.
      # Blocking on *critical* still catches a real regression without that
      # false-positive noise; continue-on-error previously meant this step
      # could never fail CI regardless of severity.
      # Retried: the audit endpoint on registry.npmjs.org occasionally returns
      # a transient 504 (Cloudflare gateway timeout), which makes npm audit
      # exit non-zero with no vulnerability actually found. Retrying survives
      # that; a genuine critical finding still fails CI since retries won't
      # change the result.
      - name: Security Audit
        run: |
          for attempt in 1 2 3; do
            npm audit --omit=dev --audit-level=critical && exit 0
            echo "npm audit attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1
