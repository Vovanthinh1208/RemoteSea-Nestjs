name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx depcruise --config .dependency-cruiser.js src
      - run: npx tsc --noEmit
      - run: npm test -- --passWithNoTests
      - run: npm run build
      # Informational only: every current advisory needs a major-version bump
      # (Nest v11, etc.) to actually clear, tracked separately rather than
      # blocking every PR on it. Re-run without --continue-on-error once
      # those upgrades land.
      - run: npm audit --omit=dev
        continue-on-error: true
