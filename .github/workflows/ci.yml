name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Guards against a hung step holding a runner for the 6-hour default.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      # --check, not --write: `npm run format` rewrites files in the throwaway
      # CI workspace, so a formatting violation could never actually fail CI.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Dependency Cruiser
        run: npm run depcruise

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      # No --passWithNoTests: the suite has 100+ tests, and the flag would let
      # a jest config regression that matches zero tests pass silently.
      - name: Run Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Security Audit
        run: npm audit --omit=dev
        continue-on-error: true
